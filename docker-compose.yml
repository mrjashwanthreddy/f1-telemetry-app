services:
  postgres:
    image: postgres:16-alpine
    container_name: f1-telemetry-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=f1user
      - POSTGRES_PASSWORD=f1pass
      - POSTGRES_DB=f1telemetry
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1user -d f1telemetry"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .                         # builds from Dockerfile in same directory
    image: f1-telemetry-app:latest
    container_name: f1-telemetry-app
    ports:
      - "8080:8080"          # HTTP dashboard
      - "20777:20777/udp"    # F1 game UDP telemetry — REQUIRED for game data ingestion
    environment:
      - GEMINI_KEY=${GEMINI_KEY:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
